name: Refresh GitHub stats
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build accurate stats SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const login = 'hammouda997';
            let total = 0;
            let prs = 0;
            const years = [2020,2021,2022,2023,2024,2025,2026];
            for (const year of years) {
              const from = year === 2020 ? '2020-10-25T00:00:00Z' : `${year}-01-01T00:00:00Z`;
              const to = year === 2026 ? new Date().toISOString() : `${year}-12-31T23:59:59Z`;
              const q = `query { user(login:"${login}") { pullRequests { totalCount } contributionsCollection(from:"${from}", to:"${to}") { contributionCalendar { totalContributions } } } }`;
              const res = await github.graphql(q);
              total += res.user.contributionsCollection.contributionCalendar.totalContributions;
              prs = res.user.pullRequests.totalCount;
            }
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="420" height="195" viewBox="0 0 420 195" role="img">
  <title>Hammouda Msaad GitHub Stats</title>
  <style>
    .title { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .label { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .value { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .sub { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9b1d6; }
  </style>
  <rect width="420" height="195" rx="6" fill="#1a1b27"/>
  <text x="25" y="35" class="title">Hammouda Msaad's GitHub Stats</text>
  <g transform="translate(25, 58)">
    <text class="label" x="0" y="0">Total Contributions</text>
    <text class="value" x="290" y="0" text-anchor="end">${total.toLocaleString('en-US')}</text>
    <text class="label" x="0" y="32">Private + Public (lifetime)</text>
    <text class="value" x="290" y="32" text-anchor="end">incl. private</text>
    <text class="label" x="0" y="64">Pull Requests</text>
    <text class="value" x="290" y="64" text-anchor="end">${prs}</text>
    <text class="label" x="0" y="96">Joined GitHub</text>
    <text class="value" x="290" y="96" text-anchor="end">Oct 2020</text>
  </g>
  <text x="25" y="180" class="sub">Source: GitHub GraphQL · includes private contributions</text>
</svg>`;
            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/github-stats.svg', svg);
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh accurate GitHub stats"
          git push